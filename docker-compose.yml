version: '3.8'

services:
  # ---- Cookie 管理服务（可选，用于多账号管理与自动故障转移） ----
  bili-cookie-manager:
    image: node:18-alpine
    container_name: bili-cookie-manager
    restart: unless-stopped
    working_dir: /app
    # 将 bili-cookie-manager 项目目录挂载进来
    # 请将 ../bili-cookie-manager 改为实际路径
    volumes:
      - ../bili-cookie-manager:/app
      - /app/node_modules
      - bili_cookie_data:/app/data
    command: sh -c "npm install --omit=dev && node server.js"
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      # 只允许来自 unia-danmuku 容器的跨域请求
      - ALLOWED_ORIGINS=http://localhost:3000
    networks:
      - unia-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3100/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  unia-danmuku:
    build:
      context: .
      dockerfile: Dockerfile
    image: unia-danmuku:latest
    container_name: unia-danmuku
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # 持久化存储 cookies 和日志
      - ./backend/data:/app/backend/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost:3000
      # ---- Cookie 管理服务地址 ----
      # 启用多账号 Cookie 管理时取消注释下面这行（需要同时启动 bili-cookie-manager 服务）
      # - COOKIE_MANAGER_URL=http://bili-cookie-manager:3100
      #
      # 若只使用本地单账号 Cookie，保持注释即可（默认行为不变）
    depends_on:
      - bili-cookie-manager
    networks:
      - unia-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  unia-network:
    driver: bridge

volumes:
  bili_cookie_data:
